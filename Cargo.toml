[package]
name = "uvpad"
version = "0.2.0"
edition = "2021"
description = "Fast, low-memory texture dilating (UV padding) tool, a Rust port of meir/uvpad"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"
rayon = "1"
cxx = { version = "1", optional = true }
cxx-qt = { version = "0.10", optional = true }
cxx-qt-lib = { version = "0.10", optional = true, features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", optional = true, features = ["link_qt_object_files"] }

[features]
default = []
# Qt 6 / QML desktop UI, started with `uvpad --gui`. Needs Qt 6 (qmake6) at build time.
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
