[package]
name = "uvpad"
version = "0.2.0"
edition = "2021"
description = "Fast, low-memory texture dilating (UV padding) tool, a Rust port of meir/uvpad"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
